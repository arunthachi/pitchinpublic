name: Database contracts

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-contracts.yml'
  push:
    branches: [main, test-env]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-contracts.yml'

permissions:
  contents: read

jobs:
  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild schema from migrations
        run: supabase db reset --local
      - name: Run pgTAP contracts
        run: supabase test db --local
